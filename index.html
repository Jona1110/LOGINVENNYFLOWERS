<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso | Venny Flowers</title>
    
    <!-- Etiquetas PWA / Ícono Embebido -->
    <meta name="theme-color" content="#FAF6F0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23FAF6F0'/%3E%3Ccircle cx='50' cy='50' r='35' fill='%23C5A059'/%3E%3Ctext x='50' y='62' font-family='Georgia, serif' font-size='32' font-weight='bold' fill='%23fff' text-anchor='middle'%3EVF%3C/text%3E%3C/svg%3E">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .text-oro { color: #C5A059; }
        .bg-oro { background-color: #C5A059; }
        .border-oro { border-color: #C5A059; }
        .text-cafe { color: #6B4E31; }
        .bg-crema { background-color: #FAF6F0; }
        .bg-rosa-suave { background-color: #F8E5E5; }
    </style>
</head>
<body class="bg-crema text-stone-800 antialiased min-h-screen flex items-center justify-center p-4 bg-[url('data:image/svg+xml,%3Csvg width=\'20\' height=\'20\' viewBox=\'0 0 20 20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'%23e8dcc4\' fill-opacity=\'0.2\' fill-rule=\'evenodd\'%3E%3Ccircle cx=\'3\' cy=\'3\' r=\'3\'/%3E%3Ccircle cx=\'13\' cy=\'13\' r=\'3\'/%3E%3C/g%3E%3C/svg%3E')]">

    <main class="w-full max-w-md animate-fade-in-up">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-[#E8DCC4]">
            
            <!-- Encabezado del Login -->
            <div class="bg-rosa-suave/30 p-8 text-center border-b border-[#E8DCC4]">
                <div class="w-20 h-20 mx-auto bg-[#FAF6F0] rounded-full border-2 border-oro flex items-center justify-center shadow-md mb-4">
                    <span class="text-2xl font-bold font-playfair text-oro">VF</span>
                </div>
                <h1 class="font-playfair text-3xl font-bold text-cafe">Venny Flowers</h1>
                <p class="text-xs font-semibold text-stone-500 uppercase tracking-widest mt-1">Portal de Acceso</p>
            </div>

            <!-- Formulario -->
            <div class="p-8">
                <form id="login-form" class="space-y-6">
                    
                    <!-- Selección de Rol -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-cafe mb-3 tracking-wider text-center">Selecciona tu área</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="role-selector cursor-pointer relative">
                                <input type="radio" name="role" value="pos" class="peer sr-only" checked>
                                <div class="p-3 border-2 border-[#E8DCC4] rounded-xl text-center transition-all peer-checked:border-oro peer-checked:bg-rosa-suave peer-checked:shadow-sm">
                                    <svg class="w-6 h-6 mx-auto mb-1 text-stone-400 peer-checked:text-oro transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                                    <span class="text-xs font-bold text-stone-500 peer-checked:text-cafe transition-colors">Caja / Mostrador</span>
                                </div>
                            </label>
                            
                            <label class="role-selector cursor-pointer relative">
                                <input type="radio" name="role" value="admin" class="peer sr-only">
                                <div class="p-3 border-2 border-[#E8DCC4] rounded-xl text-center transition-all peer-checked:border-oro peer-checked:bg-rosa-suave peer-checked:shadow-sm">
                                    <svg class="w-6 h-6 mx-auto mb-1 text-stone-400 peer-checked:text-oro transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    <span class="text-xs font-bold text-stone-500 peer-checked:text-cafe transition-colors">Administración</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-cafe mb-2 tracking-wider">Contraseña de acceso</label>
                        <div class="relative">
                            <input type="password" id="password" required placeholder="••••••••" class="w-full bg-stone-50 border-2 border-[#E8DCC4] rounded-xl p-3 pr-10 text-sm focus:outline-none focus:border-oro transition-colors font-medium text-cafe">
                            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-stone-400 hover:text-oro transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="eye-icon-open"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                <svg class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="eye-icon-closed"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                            </button>
                        </div>
                        <p id="error-message" class="text-rose-600 text-xs font-bold mt-2 hidden text-center animate-shake">Contraseña incorrecta. Intenta de nuevo.</p>
                    </div>

                    <!-- Botón Ingresar -->
                    <button type="submit" id="btn-login" class="w-full bg-oro text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-[#b58f4a] transition-all transform hover:-translate-y-0.5 flex justify-center items-center space-x-2">
                        <span>Ingresar al Sistema</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </form>
            </div>
            
            <div class="bg-stone-50 p-4 text-center border-t border-[#E8DCC4]">
                <p class="text-[10px] text-stone-400 font-semibold uppercase tracking-wider">Desarrollado por Digitality</p>
            </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
